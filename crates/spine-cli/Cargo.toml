[package]
name = "spine-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "spine"
path = "src/main.rs"

[dependencies]
spine-canon = { path = "../spine-canon" }
spine-manifest = { path = "../spine-manifest" }
spine-graph = { path = "../spine-graph" }
spine-collect = { path = "../spine-collect" }
spine-init = { path = "../spine-init" }
spine-runner = { path = "../spine-runner" }
spine-template = { path = "../spine-template" }

[features]
# Compiles `release/release.synthetic.json` into the binary so `spine init` can
# run its apply path. OFF by default: without it this is a development build and
# init refuses every plan row, which is ci.md §3.4's specified behaviour and not
# a gap. See `release/README.md` — a binary built with this must never ship.
synthetic-release = []

[lints]
workspace = true
